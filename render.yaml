services:
  - type: web
    name: mf-faq-rag-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/startup.py && streamlit run app/main.py --server.port=$PORT --server.address=0.0.0.0 --server.headless true
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
